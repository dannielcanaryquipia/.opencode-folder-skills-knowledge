<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phosphor Icons — Local Gallery</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e9ef; --muted:#8b93a3; --accent:#7aa2ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 18px; }
  h1 { margin:0 0 10px; font-size:16px; font-weight:650; }
  h1 span { color:var(--muted); font-weight:400; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input[type=search] { flex:1; min-width:220px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--text); }
  select { padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--text); }
  .count { color:var(--muted); font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; padding:16px 18px 48px; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px; border:1px solid var(--line); border-radius:10px; background:var(--panel); cursor:pointer; transition:border-color .12s, transform .12s; }
  .cell:hover { border-color:var(--accent); transform:translateY(-1px); }
  .cell img { width:34px; height:34px; /* recolor line icons to text color */ filter:invert(92%) sepia(6%) saturate(300%) hue-rotate(190deg) brightness(105%); }
  .cell.raw img { filter:none; }
  .cell .name { font-size:10px; color:var(--muted); text-align:center; word-break:break-word; line-height:1.2; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--accent); color:#0b0e14; padding:9px 16px; border-radius:999px; font-weight:600; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .hint { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Phosphor Icons <span>· local set · 1,512 icons × 6 weights</span></h1>
  <div class="controls">
    <input id="q" type="search" placeholder="Search icons… (e.g. arrow, user, gear)" autofocus />
    <select id="weight">
      <option value="thin">Thin</option>
      <option value="light">Light</option>
      <option value="regular" selected>Regular</option>
      <option value="bold">Bold</option>
      <option value="fill">Fill</option>
      <option value="duotone">Duotone</option>
    </select>
    <select id="copymode">
      <option value="name">Copy: name</option>
      <option value="path">Copy: file path</option>
      <option value="img">Copy: &lt;img&gt; tag</option>
      <option value="svg">Copy: inline SVG</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div class="hint">Click an icon to copy. Duotone/fill keep original colors; other weights are tinted to match this page.</div>
</header>
<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>

<script src="icons.js"></script>
<script>
const grid = document.getElementById('grid');
const q = document.getElementById('q');
const weightSel = document.getElementById('weight');
const copySel = document.getElementById('copymode');
const countEl = document.getElementById('count');
const toast = document.getElementById('toast');
const ALL = window.PHOSPHOR_ICONS || [];

function fileFor(name, weight) {
  const suffix = weight === 'regular' ? '' : '-' + weight;
  return `SVGs/${weight}/${name}${suffix}.svg`;
}
function isColor(weight){ return weight === 'duotone' || weight === 'fill'; }

function render() {
  const term = q.value.trim().toLowerCase();
  const weight = weightSel.value;
  const raw = isColor(weight);
  const list = term ? ALL.filter(n => n.includes(term)) : ALL;
  countEl.textContent = list.length + ' shown';
  const frag = document.createDocumentFragment();
  for (const name of list) {
    const cell = document.createElement('div');
    cell.className = 'cell' + (raw ? ' raw' : '');
    cell.dataset.name = name;
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = fileFor(name, weight);
    img.alt = name;
    const label = document.createElement('div');
    label.className = 'name';
    label.textContent = name;
    cell.appendChild(img); cell.appendChild(label);
    frag.appendChild(cell);
  }
  grid.replaceChildren(frag);
}

async function copyForCell(name) {
  const weight = weightSel.value;
  const path = fileFor(name, weight);
  const mode = copySel.value;
  let text = name;
  if (mode === 'path') text = path;
  else if (mode === 'img') text = `<img src="${path}" width="24" height="24" alt="${name}">`;
  else if (mode === 'svg') {
    try { text = await (await fetch(path)).text(); }
    catch { text = path; showToast('Could not read SVG (open via a local server) — copied path'); }
  }
  try { await navigator.clipboard.writeText(text); showToast('Copied: ' + (text.length > 40 ? name + ' ('+mode+')' : text)); }
  catch { showToast('Clipboard blocked — value logged to console'); console.log(text); }
}

let toastTimer;
function showToast(msg){ toast.textContent = msg; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>toast.classList.remove('show'), 1600); }

grid.addEventListener('click', e => { const c = e.target.closest('.cell'); if (c) copyForCell(c.dataset.name); });
let deb; q.addEventListener('input', ()=>{ clearTimeout(deb); deb = setTimeout(render, 120); });
weightSel.addEventListener('change', render);
render();
</script>
</body>
</html>
